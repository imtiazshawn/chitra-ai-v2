services:
  redis:
    image: redis:7-alpine
    container_name: chitraai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  api:
    build: .
    container_name: chitraai-api
    command: python main.py
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

  worker-default:
    build: .
    container_name: chitraai-worker-default
    command: celery -A app.core.celery_app.celery_app worker
      --queues=default
      --hostname=worker-default@%h
      --concurrency=4
      --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

  worker-io:
    build: .
    container_name: chitraai-worker-io
    command: celery -A app.core.celery_app.celery_app worker
      --queues=io_heavy
      --hostname=worker-io@%h
      --concurrency=8
      --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

  worker-cpu:
    build: .
    container_name: chitraai-worker-cpu
    command: celery -A app.core.celery_app.celery_app worker
      --queues=cpu_heavy
      --hostname=worker-cpu@%h
      --concurrency=2
      --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
